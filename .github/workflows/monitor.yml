name: Monitor YouTube Channel

on:
  schedule:
    # Run at 8am and 8pm UTC
    - cron: '0 8,20 * * *'
  workflow_dispatch:
    # Allow manual trigger
    inputs:
      force_url:
        description: 'Force process a specific video URL (optional)'
        required: false
        type: string

env:
  WHISPER_MODEL: medium
  GPT_MODEL: gpt-4o-mini

jobs:
  check-and-process:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Required to push commits

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Cache apt packages
        uses: awalsh128/cache-apt-pkgs-action@latest
        with:
          packages: ffmpeg
          version: 1.0

      - name: Cache Whisper model
        uses: actions/cache@v4
        with:
          path: ~/.cache/whisper
          key: whisper-${{ env.WHISPER_MODEL }}

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check for new videos
        id: monitor
        if: ${{ !inputs.force_url }}
        env:
          YOUTUBE_CHANNEL_ID: ${{ secrets.YOUTUBE_CHANNEL_ID }}
        run: |
          set +e  # Don't exit on error
          python src/monitor.py 2>&1 | tee monitor_output.txt
          EXIT_CODE=${PIPESTATUS[0]}
          set -e

          if [ $EXIT_CODE -ne 0 ]; then
            echo "Monitor script failed with exit code $EXIT_CODE"
            exit $EXIT_CODE
          fi

          if grep -q "Found .* new video" monitor_output.txt; then
            echo "new_video=true" >> $GITHUB_OUTPUT
            VIDEO_URL=$(python3 -c "import re; import sys; m = re.search(r'https://www\.youtube\.com/watch\?v=\S+', sys.stdin.read()); print(m.group(0) if m else '')" < monitor_output.txt)
            echo "video_url=${VIDEO_URL}" >> $GITHUB_OUTPUT
            VIDEO_ID=$(python3 -c "import re; m = re.search(r'v=([^&]+)', '${VIDEO_URL}'); print(m.group(1) if m else '')")
            echo "video_id=${VIDEO_ID}" >> $GITHUB_OUTPUT
          else
            echo "new_video=false" >> $GITHUB_OUTPUT
          fi

      - name: Set forced URL
        id: forced
        if: ${{ inputs.force_url }}
        run: |
          echo "new_video=true" >> $GITHUB_OUTPUT
          echo "video_url=${{ inputs.force_url }}" >> $GITHUB_OUTPUT

      - name: Get video metadata
        id: metadata
        if: steps.monitor.outputs.new_video == 'true' || steps.forced.outputs.new_video == 'true'
        run: |
          VIDEO_URL="${{ steps.monitor.outputs.video_url || steps.forced.outputs.video_url }}"
          echo "Getting metadata for: $VIDEO_URL"

          # Extract video ID from URL
          VIDEO_ID=$(python3 -c "import re; m = re.search(r'v=([^&]+)', '${VIDEO_URL}'); print(m.group(1) if m else '')")
          echo "Video ID: $VIDEO_ID"

          # Check live status using yt-dlp (allow it to fail)
          echo "Checking live status..."
          set +e
          VIDEO_INFO=$(yt-dlp --extractor-args youtube:player_client=web --dump-json --skip-download "$VIDEO_URL" 2>&1)
          YTDLP_EXIT_CODE=$?
          set -e

          # Check if yt-dlp failed due to upcoming live stream
          if [ $YTDLP_EXIT_CODE -ne 0 ]; then
            if echo "$VIDEO_INFO" | grep -q "live event will begin"; then
              echo "Video is scheduled but not yet available. Skipping."
              echo "is_available=false" >> $GITHUB_OUTPUT
              exit 0
            else
              # Different error - fail the step
              echo "yt-dlp failed with unexpected error:"
              echo "$VIDEO_INFO"
              exit 1
            fi
          fi

          LIVE_STATUS=$(echo "$VIDEO_INFO" | jq -r '.live_status // "not_live"')
          echo "Live status: $LIVE_STATUS"

          # Also check live_status field in case yt-dlp succeeds but video is upcoming
          if [ "$LIVE_STATUS" = "is_upcoming" ]; then
            echo "Video is scheduled but not yet available. Skipping."
            echo "is_available=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "is_available=true" >> $GITHUB_OUTPUT

          # Get title from YouTube oEmbed API (no auth required)
          OEMBED_URL="https://www.youtube.com/oembed?url=${VIDEO_URL}&format=json"
          echo "Fetching oEmbed: $OEMBED_URL"
          OEMBED_JSON=$(curl -s "$OEMBED_URL")
          echo "oEmbed response: $OEMBED_JSON"

          TITLE=$(echo "$OEMBED_JSON" | jq -r '.title')
          echo "Title: $TITLE"

          # Try to parse date from title (common formats: "Jan. 6, 2026", "January 6, 2026", "2026-01-06")
          # Extract date if present, otherwise no date prefix
          FORMATTED_DATE=""

          # Try "Mon. D, YYYY" or "Month D, YYYY" format
          DATE_STR=$(python3 -c "import re; m = re.search(r'(Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)[a-z]*\.?\s+\d{1,2},?\s+\d{4}', '${TITLE}'); print(m.group(0) if m else '')")
          if [ -n "$DATE_STR" ]; then
            FORMATTED_DATE=$(date -d "$DATE_STR" +%Y-%m-%d 2>/dev/null || echo "")
          fi

          # Try "YYYY-MM-DD" format
          if [ -z "$FORMATTED_DATE" ]; then
            FORMATTED_DATE=$(python3 -c "import re; m = re.search(r'\d{4}-\d{2}-\d{2}', '${TITLE}'); print(m.group(0) if m else '')")
          fi

          if [ -n "$FORMATTED_DATE" ]; then
            echo "Parsed date: $FORMATTED_DATE"
          else
            echo "No date found in title"
          fi

          # Sanitize title for filename
          SAFE_TITLE=$(echo "$TITLE" | tr ' ' '_' | tr -cd '[:alnum:]_-' | cut -c1-100)

          # Fallback if title is empty
          if [ -z "$SAFE_TITLE" ]; then
            SAFE_TITLE="$VIDEO_ID"
          fi

          # Build filename with or without date
          if [ -n "$FORMATTED_DATE" ]; then
            FILENAME="sermon_${FORMATTED_DATE}_${SAFE_TITLE}"
          else
            FILENAME="sermon_${SAFE_TITLE}"
          fi

          echo "Filename: $FILENAME"
          echo "video_id=${VIDEO_ID}" >> $GITHUB_OUTPUT
          echo "filename=${FILENAME}" >> $GITHUB_OUTPUT
          echo "title=${TITLE}" >> $GITHUB_OUTPUT
          echo "date=${FORMATTED_DATE}" >> $GITHUB_OUTPUT

      - name: Download audio
        if: (steps.monitor.outputs.new_video == 'true' || steps.forced.outputs.new_video == 'true') && steps.metadata.outputs.is_available == 'true'
        run: |
          VIDEO_URL="${{ steps.monitor.outputs.video_url || steps.forced.outputs.video_url }}"
          echo "Downloading: $VIDEO_URL"
          mkdir -p output
          yt-dlp --extractor-args youtube:player_client=web -x --audio-format mp3 -o "output/audio.%(ext)s" "$VIDEO_URL"

      - name: Transcribe audio
        if: (steps.monitor.outputs.new_video == 'true' || steps.forced.outputs.new_video == 'true') && steps.metadata.outputs.is_available == 'true'
        run: |
          echo "Transcribing with Whisper ($WHISPER_MODEL model)..."
          python src/transcribe.py output/audio.mp3 $WHISPER_MODEL

      - name: Segment sermon
        id: segment
        if: (steps.monitor.outputs.new_video == 'true' || steps.forced.outputs.new_video == 'true') && steps.metadata.outputs.is_available == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          echo "Segmenting with GPT ($GPT_MODEL)..."
          set +e  # Don't exit on error
          python src/segment.py audio_transcript.json $GPT_MODEL
          EXIT_CODE=$?
          set -e
          if [ $EXIT_CODE -eq 2 ]; then
            echo "No sermon found in video - skipping cleanup"
            echo "sermon_found=false" >> $GITHUB_OUTPUT
          elif [ $EXIT_CODE -ne 0 ]; then
            echo "Segmentation failed with exit code $EXIT_CODE"
            exit $EXIT_CODE
          else
            echo "sermon_found=true" >> $GITHUB_OUTPUT
          fi

      - name: Cleanup transcript
        if: (steps.monitor.outputs.new_video == 'true' || steps.forced.outputs.new_video == 'true') && steps.metadata.outputs.is_available == 'true' && steps.segment.outputs.sermon_found == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          echo "Cleaning up transcript..."
          FILENAME="${{ steps.metadata.outputs.filename }}"
          python src/cleanup.py audio_sermon.json $GPT_MODEL "output/${FILENAME}.txt"

      - name: Publish to Jekyll
        if: (steps.monitor.outputs.new_video == 'true' || steps.forced.outputs.new_video == 'true') && steps.metadata.outputs.is_available == 'true' && steps.segment.outputs.sermon_found == 'true'
        run: |
          echo "Publishing sermon to Jekyll..."
          FILENAME="${{ steps.metadata.outputs.filename }}"
          TITLE="${{ steps.metadata.outputs.title }}"
          DATE="${{ steps.metadata.outputs.date }}"
          VIDEO_ID="${{ steps.metadata.outputs.video_id }}"

          python src/publish_sermon.py "output/${FILENAME}.txt" "$TITLE" "$DATE" "$VIDEO_ID"

      - name: Update state
        if: steps.monitor.outputs.new_video == 'true'
        run: |
          VIDEO_ID="${{ steps.monitor.outputs.video_id }}"
          python -c "
          import json
          from datetime import datetime
          state = {'last_video_id': '${VIDEO_ID}', 'last_check': datetime.utcnow().isoformat()}
          with open('state.json', 'w') as f:
              json.dump(state, f, indent=2)
          "

      - name: Commit results
        if: steps.monitor.outputs.new_video == 'true' || steps.forced.outputs.new_video == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          VIDEO_ID="${{ steps.metadata.outputs.video_id }}"
          FILENAME="${{ steps.metadata.outputs.filename }}"
          SERMON_FOUND="${{ steps.segment.outputs.sermon_found }}"
          IS_AVAILABLE="${{ steps.metadata.outputs.is_available }}"

          # Add the sermon transcript and Jekyll file if they exist
          if [ "$SERMON_FOUND" == "true" ]; then
            git add "output/${FILENAME}.txt" || true
            git add docs/_sermons/ || true
          fi
          git add state.json || true

          # Check if there are changes to commit
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            if [ "$SERMON_FOUND" == "true" ]; then
              git commit -m "Add sermon: ${FILENAME}"
            elif [ "$IS_AVAILABLE" == "false" ]; then
              git commit -m "Skip upcoming video: ${VIDEO_ID}"
            else
              git commit -m "Update state: no sermon found in video ${VIDEO_ID}"
            fi
            git push
          fi

      - name: Upload artifact
        if: (steps.monitor.outputs.new_video == 'true' || steps.forced.outputs.new_video == 'true') && steps.metadata.outputs.is_available == 'true' && steps.segment.outputs.sermon_found == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: sermon-transcript
          path: output/sermon_*.txt
          retention-days: 30
